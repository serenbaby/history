name: Deploy history site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged site
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/site.zip "https://aka.doubaocdn.com/s/BIPBOJ5JS1"
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/detail.html
          test -f /tmp/site/timeline.html

      - name: Sync source and restore normal workflow
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='.github' /tmp/site/ ./
          echo '' | base64 -d > .github/workflows/deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'deploy: sync source 2026-11-24 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
