name: Deploy history site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download site bundle
        env:
          BUNDLE_URL: https://aka.doubaocdn.com/s/k9zgP9Ej89
        run: |
          set -euo pipefail
          mkdir -p site
          curl -fL "$BUNDLE_URL" -o bundle.zip
          unzip -q bundle.zip -d bundle
          test -f bundle/history/index.html
          cp -r bundle/history/. site/
          rm -rf site/.git
          ls -la site | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
