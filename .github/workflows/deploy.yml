name: Deploy history site

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download site bundle
        env:
          BUNDLE_URL: https://aka.doubaocdn.com/s/k9zgP9Ej89
        run: |
          set -euo pipefail
          curl -fL "$BUNDLE_URL" -o bundle.zip
          unzip -q bundle.zip -d bundle
          test -f bundle/history/index.html
          cp -a bundle/history/. .
          rm -rf bundle bundle.zip
          touch .nojekyll

      - name: Commit source files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes'
          else
            git commit -m 'deploy: 同步 66 课知识库与历史时间线源码'
            git push origin HEAD:main
          fi

      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/site/
          test -f /tmp/site/index.html
          du -sh /tmp/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
