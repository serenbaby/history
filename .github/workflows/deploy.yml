name: Deploy history site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged site
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/site.zip "https://aka.doubaocdn.com/s/61QPPDBLBW"
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/detail.html
          test -f /tmp/site/timeline.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
